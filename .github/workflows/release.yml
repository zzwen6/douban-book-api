name: Release images

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".gitignore"
      - "test/**"
      - "tamper-monkey-script.js"
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/zzwen6/douban-book-api
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub-hosted runners are overseas; override the Dockerfile's China npm mirror.
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org/
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify NAS Watchtower
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_WEBHOOK_URL:-}" ] || [ -z "${DEPLOY_WEBHOOK_TOKEN:-}" ]; then
            echo "DEPLOY_WEBHOOK_URL 或 DEPLOY_WEBHOOK_TOKEN 未配置，跳过通知 NAS。"
            echo "在仓库 Settings → Secrets and variables → Actions 中同时设置这两项后，下次构建成功会立刻触发部署。"
            exit 0
          fi
          http_code=$(curl -sS -o /tmp/watchtower-body -w "%{http_code}" \
            --connect-timeout 15 --max-time 60 \
            -H "Authorization: Bearer ${DEPLOY_WEBHOOK_TOKEN}" \
            "${DEPLOY_WEBHOOK_URL}")
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Watchtower webhook 返回 HTTP ${http_code}："
            cat /tmp/watchtower-body || true
            exit 1
          fi
          echo "已通知 Watchtower（HTTP ${http_code}）。"
